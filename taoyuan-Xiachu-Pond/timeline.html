<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>下厝埤時間軸</title>

<style>
body {
  font-family: Arial;
  background: #f1f8e9;
  margin: 0;
  padding: 0;
}

.navbar {
  background: #2e7d32;
  padding: 10px;
  text-align: center;
  position: sticky;
  top: 0;
}

.navbar a {
  color: white;
  margin: 10px;
  text-decoration: none;
  font-weight: bold;

  text-align: center;
  color: #1b5e20;
  margin-top: 20px;
}

.card {
  max-width: 900px;
  margin: 20px auto;
  background: white;
  padding: 20px;
  border-radius: 12px;
}

/* 📊 圖表 */
canvas {
  width: 100%;
}

/* 📖 時間軸 */
.item {
  background: #e8f5e9;
  margin: 10px 0;
  padding: 15px;
  border-radius: 10px;
  cursor: pointer;
}

.detail {
  display: none;
  margin-top: 10px;
  color: #333;
}

/* 🧾 事件框 */
#eventBox {
  margin-top: 15px;
  padding: 12px;
  background: #e8f5e9;
  border-radius: 10px;
  min-height: 50px;
}
</style>

<body>

<h1>🧭 下厝埤時間軸</h1>

<!-- 📍 地圖 -->
<div class="card">
<h2>📍 地理位置</h2>

<p>下厝埤位於桃園青埔地區，是重要埤塘系統之一。</p>

<a href="https://maps.google.com/maps?vet=10CAAQoqAOahcKEwjI5M6P9fmUAxUAAAAAHQAAAAAQFg..i&sca_esv=bcc915fd4b92abab&pvq=Cg0vZy8xMXN0OGhmZG5oIhUKD-S4i-WOneWfpOWcsOm7nhACGAM&lqi=Cg_kuIvljp3ln6TlnLDpu55Ij-Xah-W4gIAIWiIQABABEAIQAxgAGAEYAiIS5LiLIOWOnSDln6Qg5Zyw6buekgESdG91cmlzdF9hdHRyYWN0aW9umgEkQ2hkRFNVaE5NRzluUzBWSlUwNDVjMjFDYW5CdVpEUkJSUkFC-gEECAAQBw&fvr=1&cs=0&um=1&ie=UTF-8&fb=1&gl=tw&sa=X&ftid=0x3468210741562e8b:0xa318fd6e1f5c9a12"
target="_blank">📍 Google Maps</a>
</div>

<!-- 📊 圖表 + 事件 -->
<div class="card">
<h2>📊 歷史變化</h2>

<canvas id="myChart"></canvas>

<div id="eventBox">▶ 點擊播放開始觀看歷史變化</div>

<button onclick="togglePlay()" id="playBtn">▶ 播放</button>

<input type="range" id="slider" min="1" max="5" value="1"
oninput="jumpTo(this.value)">
</div>

<!-- 📖 時間軸 -->
<div class="card">
<h2>📖 時間軸</h2>

<div class="item" onclick="toggle(this)">
清代
<div class="detail">開始形成埤塘與農業聚落。</div>
</div>

<div class="item" onclick="toggle(this)">
日治
<div class="detail">地名與水利系統正式記錄。</div>
</div>

<div class="item" onclick="toggle(this)">
戰後
<div class="detail">農業發展穩定。</div>
</div>

<div class="item" onclick="toggle(this)">
都市化
<div class="detail">農地減少但埤塘仍存在。</div>
</div>

<div class="item" onclick="toggle(this)">
現代
<div class="detail">轉型為生態與文化空間。</div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const labels = ['清代','日治','戰後','都市化','現代'];

const data1 = [5,5,4,2,1];
const data2 = [1,2,3,5,5];

const events = [
"清代：埤塘開始形成",
"日治：正式地名記錄",
"戰後：農業穩定發展",
"都市化：功能轉變",
"現代：生態保育"
];

let step = 1;
let playing = false;
let interval;
let chart;

function updateEvent(s){
document.getElementById("eventBox").innerText = events[s-1];
}

function buildChart(s){
const ctx = document.getElementById('myChart');

if(chart) chart.destroy();

chart = new Chart(ctx,{
type:'line',
data:{
labels:labels.slice(0,s),
datasets:[
{
label:'農業',
data:data1.slice(0,s),
borderColor:'#2e7d32',
fill:true,
tension:0.4
},
{
label:'都市',
data:data2.slice(0,s),
borderColor:'#1565c0',
fill:true,
tension:0.4
}
]
},
options:{
responsive:true,
animation:{duration:600},
scales:{y:{beginAtZero:true,max:6}}
}
});

document.getElementById("slider").value=s;
updateEvent(s);
}

function play(){
interval=setInterval(()=>{
if(!playing)return;
step++;
if(step>5)step=1;
buildChart(step);
},1200);
}

function togglePlay(){
playing=!playing;
document.getElementById("playBtn").innerText=
playing?"⏸ 暫停":"▶ 播放";
}

function jumpTo(v){
step=parseInt(v);
buildChart(step);
}

function toggle(el){
let d=el.querySelector(".detail");
d.style.display=(d.style.display==="block")?"none":"block";
}

buildChart(1);
play();
</script>

</body>
</html>
