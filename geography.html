<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>下厝埤地景與互動分析</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(to bottom,#1b4332,#2d6a4f,#1f5e3b);
  color:white;
  padding-top:60px;
  font-size:18px;
  line-height:1.8;
}

/* 導覽列 */
.navbar{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  background:rgba(20,60,30,0.95);
  display:flex;
  justify-content:center;
  gap:10px;
  padding:10px;
  z-index:999;
}

.navbar a{
  color:white;
  text-decoration:none;
  padding:8px 12px;
  border-radius:8px;
  background:#2e7d32;
  font-size:14px;
}

/* 標題 */
h1{
  text-align:center;
}

h2{
  border-left:6px solid #66bb6a;
  padding-left:10px;
}

/* 卡片 */
.card{
  max-width:900px;
  margin:20px auto;
  background:rgba(0,0,0,0.35);
  padding:20px;
  border-radius:15px;
  backdrop-filter:blur(6px);
}

/* ===== 圖片統一控制 ===== */
img{
  max-width:100%;
  height:auto;
  display:block;
  margin:20px auto;
  border-radius:12px;
}

/* 👉 第一張介紹圖（你要小圖就用這個） */
.landscape-img{
  width:40%;
  max-width:350px;
}

/* 👉 互動地圖圖片（保留大圖） */
.map{
  position:relative;
  max-width:900px;
  margin:auto;
}

.map img{
  width:70%;
  max-width:600px;
}

/* 熱點 */
.hotspot{
  position:absolute;
  width:18px;
  height:18px;
  border-radius:50%;
  background:red;
  cursor:pointer;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.4);}
  100%{transform:scale(1);}
}

/* 圖表 */
.chart-box{
  max-width:900px;
  margin:20px auto;
  background:rgba(255,255,255,0.08);
  padding:20px;
  border-radius:15px;
}

canvas{
  width:100%;
  background:white;
  border-radius:12px;
}

/* popup */
.popup{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#222;
  padding:15px;
  border-radius:10px;
  display:none;
  max-width:400px;
}
</style>
</head>

<body>

<!-- NAV -->
<div class="navbar">
<a href="index.html">🏠 首頁</a>

<h1>🌄 下厝埤地景與水文整合分析</h1>

<!-- 介紹圖（小圖） -->
<div class="card">

<img src="images/地景.JPG" class="landscape-img">

<p>
下厝埤位於桃園台地，是典型埤塘地景之一。
它屬於人工蓄水系統，而非天然湖泊。
</p>

<p>
隨著時間演變，下厝埤從農業設施轉變為生態與景觀空間。
</p>

</div>

<!-- 地形 -->
<div class="card">
<h2>🗺️ 地形與水文背景</h2>
<p>桃園台地因排水不良形成埤塘系統。</p>
</div>

<!-- 水文 -->
<div class="card">
<h2>💧 水文循環</h2>
<p>具有蓄水與調節水資源功能。</p>
</div>

<!-- 生態 -->
<div class="card">
<h2>🌿 生態系統</h2>
<p>形成水域與陸域混合生態系。</p>
</div>

<!-- 圖表 -->
<div class="chart-box">
<h2>📈 功能變化</h2>

<canvas id="chart" height="300"></canvas>

<br>
<button onclick="play()">▶ 播放動畫</button>
</div>

<!-- 互動地圖 -->
<div class="card">
<h2>🎮 地景互動</h2>

<div class="map">
  <img src="images/地景.JPG">

  <div class="hotspot" style="top:40%;left:30%;" onclick="show('水域核心')"></div>
  <div class="hotspot" style="top:55%;left:60%;" onclick="show('濕地區')"></div>
  <div class="hotspot" style="top:30%;left:70%;" onclick="show('岸邊活動區')"></div>
</div>
</div>

<div class="popup" id="popup"></div>

<script>
const canvas = document.getElementById("chart");
const ctx = canvas.getContext("2d");

let data = [10, 35, 25, 70, 85, 60];
let index = 0;

function draw(){
  ctx.clearRect(0,0,800,300);
  ctx.beginPath();
  ctx.moveTo(0,300-data[0]*3);

  for(let i=0;i<index;i++){
    ctx.lineTo(i*140,300-data[i]*3);
  }

  ctx.strokeStyle="#66bb6a";
  ctx.lineWidth=3;
  ctx.stroke();
}

function play(){
  index = 0;
  let t = setInterval(()=>{
    index++;
    draw();
    if(index>=data.length) clearInterval(t);
  },500);
}

function show(text){
  let p = document.getElementById("popup");
  p.innerText = text;
  p.style.display="block";
  setTimeout(()=>p.style.display="none",2500);
}

draw();
</script>

</body>
</html>
