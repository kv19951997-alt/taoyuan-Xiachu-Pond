<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>下厝埤正式測驗</title>

<style>
body{
  font-family: Arial;
  background:#f1f8e9;
  margin:0;
}

.navbar{
  background:#2e7d32;
  padding:10px;
  text-align:center;
  position:sticky;
  top:0;
}

.navbar a{
  color:white;
  margin:10px;
  text-decoration:none;
  font-weight:bold;
}

.card{
  max-width:800px;
  margin:20px auto;
  background:white;
  padding:25px;
  border-radius:12px;
}

/* ⏱ */
#timer{
  font-size:20px;
  font-weight:bold;
  color:#d32f2f;
  text-align:right;
}

/* 題目 */
#question{
  font-size:22px;
  font-weight:bold;
  margin:20px 0;
}

/* 選項 */
#answers button{
  display:block;
  width:100%;
  padding:15px;
  margin:10px 0;
  font-size:18px;
  border:none;
  border-radius:10px;
  background:#e8f5e9;
  cursor:pointer;
}

.correct{background:#a5d6a7 !important;}
.wrong{background:#ef9a9a !important;}

/* 🎉 動畫結果 */
.resultBox{
  text-align:center;
  animation: pop 0.6s ease;
}

@keyframes pop{
  0%{transform:scale(0.6);opacity:0;}
  100%{transform:scale(1);opacity:1;}
}

.grade{
  font-size:28px;
  font-weight:bold;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">🏠 首頁</a>
  <a href="history.html">📖 歷史</a>
  <a href="geography.html">🌄 地景</a>
  <a href="change.html">🔄 變化</a>
  <a href="environment.html">🌱 環境</a>
  <a href="plants.html">🌿 植物</a>
  <a href="insects.html">🐛 動物</a>
  <a href="game.html">🎮 測驗</a>
</div>

<div class="card">

<div id="timer">⏱ 60</div>

<h1>🎮 下厝埤正式測驗</h1>

<p id="question"></p>

<div id="answers"></div>

<div id="review"></div>

</div>

<script>

let time = 60;
let score = 0;
let index = 0;
let timer;

let wrongList = [];

const quiz = [
{q:"下厝埤主要的功能？",a:["灌溉與生態","作為工廠用水"],c:0,exp:"早期作為農業灌溉與蓄水"},
{q:"埤塘形成的原因？",a:["降雨不均","火山爆發"],c:0,exp:"桃園降雨不均需蓄水"},
{q:"白鷺鷥出現代表？",a:["生態良好","污染嚴重"],c:0,exp:"屬於環境指標鳥類"},
{q:"蜻蜓幼蟲在哪？",a:["水中","天空"],c:0,exp:"稚蟲生活在水域"},
{q:"澤蛙屬於？",a:["兩棲類","哺乳類"],c:0,exp:"可水陸生活"},
{q:"植物的角色？",a:["生產者","消費者"],c:0,exp:"行光合作用"},
{q:"埤塘的功能？",a:["水資源調節","釣魚的地方"],c:0,exp:"儲水與調節水量"},
{q:"生態的核心？",a:["以動植物的食物鏈維持生態","讓人類可以獵捕動物、採摘植物"],c:0,exp:"維持生態系運作"}
];

function startTimer(){
  timer = setInterval(()=>{
    time--;
    document.getElementById("timer").innerText = "⏱ " + time;

    if(time <= 0){
      time = 0;
      finish();
    }
  },1000);
}

function load(){
  if(index >= quiz.length){
    finish();
    return;
  }

  let q = quiz[index];
  document.getElementById("question").innerText = q.q;

  let html = "";
  q.a.forEach((a,i)=>{
    html += `<button onclick="answer(this,${i})">${a}</button>`;
  });

  document.getElementById("answers").innerHTML = html;
}

function answer(btn,i){

  let q = quiz[index];
  let buttons = document.querySelectorAll("#answers button");

  buttons.forEach(b => b.disabled = true);

  let correct = (i === q.c);

  if(correct){
    score++;
    btn.classList.add("correct");
  }else{
    btn.classList.add("wrong");
    wrongList.push({
      question:q.q,
      your:i,
      correct:q.a[q.c],
      explanation:q.exp
    });
  }

  setTimeout(()=>{
    index++;
    load();
  },600);
}

function finish(){
  clearInterval(timer);

  let grade = "";
  let percent = score / quiz.length;

  if(percent >= 0.8) grade = "A 🌟 優秀";
  else if(percent >= 0.6) grade = "B 🌿 普通";
  else grade = "C 🌱 加油";

  document.getElementById("question").innerHTML =
    `<div class="resultBox">
      🎉 測驗完成<br><br>
      分數：${score} / ${quiz.length}<br>
      <div class="grade">${grade}</div>
    </div>`;

  let reviewHTML = "<h2>📌 錯題回顧</h2>";

  if(wrongList.length === 0){
    reviewHTML += "<p>全部答對 🎉 很棒！</p>";
  }else{
    wrongList.forEach(w=>{
      reviewHTML += `
        <div class="card">
          <p><b>題目：</b>${w.question}</p>
          <p><b>正確答案：</b>${w.correct}</p>
          <p><b>解析：</b>${w.explanation}</p>
        </div>
      `;
    });
  }

  document.getElementById("answers").innerHTML = "";
  document.getElementById("review").innerHTML = reviewHTML;
}

load();
startTimer();

</script>

</body>
</html>
